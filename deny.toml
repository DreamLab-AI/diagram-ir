# cargo-deny policy. Checked in CI (see .github/workflows/ci.yml) and locally
# with `cargo deny check`. Licences are an allow-list of permissive terms only:
# this crate is MIT OR Apache-2.0 and must stay publishable under those terms.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
